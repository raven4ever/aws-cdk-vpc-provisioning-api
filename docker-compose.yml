services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      # An unsupported resource type must fail the deploy
      FLOCI_SERVICES_CLOUDFORMATION_ALLOW_STUB_UNSUPPORTED_RESOURCE_TYPES: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
