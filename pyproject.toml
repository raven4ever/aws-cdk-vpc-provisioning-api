[project]
name = "aws-cdk-vpc-provisioning-api"
version = "0.1.0"
description = "VPC Provisioning API"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "aws-cdk-lib>=2.275.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]
